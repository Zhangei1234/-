<svg xmlns="http://www.w3.org/2000/svg" width="240" height="34" viewBox="0 0 240 34">
  <defs>
    <clipPath id="clip">
      <rect width="240" height="34" rx="7"/>
    </clipPath>
    <linearGradient id="g-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d424d"/>
      <stop offset="1" stop-color="#2a2e36"/>
    </linearGradient>
    <linearGradient id="g-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="1" stop-color="#00a854"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="140" height="34" fill="url(#g-left)"/>
    <rect x="140" width="100" height="34" fill="url(#g-right)"/>
    <text x="70" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Zhangei</text>
    <text x="450" y="22" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">超级无敌至尊大笨比</text>
  </g>
</svg>
