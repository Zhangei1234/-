<svg xmlns="http://www.w3.org/2000/svg" width="240" height="34" viewBox="0 0 250 34">
  <defs>
    <clipPath id="clip">
      <rect width="240" height="34" rx="7"/>
    </clipPath>
    <linearGradient id="g-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3f2a"/>
      <stop offset="1" stop-color="#332a1a"/>
    </linearGradient>
    <linearGradient id="g-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#c9960e"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="140" height="34" fill="url(#g-left)"/>
    <rect x="140" width="100" height="34" fill="url(#g-right)"/>
    <text x="70" y="22" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">BrianQi</text>
    <text x="200" y="22" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700" fill="#332600" text-anchor="middle">伟大</text>
  </g>
</svg>
